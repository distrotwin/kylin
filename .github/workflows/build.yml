name: 构建镜像

# 只允许手动触发。构建一次要跑二十个 job、拉几个 GB，提交自动触发既费额度也
# 没必要——真正需要的是「我要出一批镜像了」这个显式动作。
#
# 阶段：
#   build    版本 × 架构 × 档位，一个 job 只建一个镜像
#   test     全部构建完成后解锁，逐个装载、真启动、跑完整检查集
#   report   每个系统一份 markdown 报告 + 一份含完整日志的 artifact
#   publish  独立于 build/test，只有显式勾选 publish 时才跑
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "测试全绿后发布到 GHCR（默认不发布）"
        type: boolean
        default: false
      include-loongarch:
        description: "把 V11 的 loong64 一并构建（需 QEMU 模拟，较慢）"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  # ── 原生架构。GitHub 的 amd64 与 arm64 runner 都是原生，不需要模拟
  build:
    strategy:
      fail-fast: false
      matrix:
        did: [v4, v10sp1, v11]
        arch: [amd64, arm64]
        tier: [micro, base, devel]
    uses: distrotwin/buildkit/.github/workflows/build-one.yml@97af05043ece47ee27fe5c2f8fb3e4b54eb482fe
    with:
      distro-id: ${{ matrix.did }}
      arch:      ${{ matrix.arch }}
      tier:      ${{ matrix.tier }}
      runner:    ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}

  # ── LoongArch。没有托管 runner，只能在 amd64 上用 QEMU 模拟，故默认关闭。
  #
  # 只有 V11 的 loong64 在列。V10 SP1 的 loongarch64 已实测排除：它是旧世界 ABI，
  # glibc 2.28 仍在调用 syscall 79/80（newfstatat / fstat），而 LoongArch 新世界把
  # 这两个调用去掉了，上游 QEMU 的 loongarch64 target 因此没有实现。最小 rootfs
  # 实跑的表现是打开 libtinfo.so.6、读出 ELF 头后报 Unknown syscall 80 退出 127。
  # 没有龙芯补丁版 QEMU 或真机就造不出来，所以不列入而不是留着让它失败。
  #
  # V11 的 loong64 通过了同一项 smoke test：bash 正常退出，内建 MACHTYPE 为
  # loongarch64-unknown-linux-gnu（编译期烧进二进制，可证明执行的是目标架构产物）。
  # 但跑通一个 bash 不等于跑得完一次 bootstrap，完整构建要在模拟下执行几百个
  # 维护者脚本，所以仍需显式勾选。
  build-loong:
    if: inputs.include-loongarch
    strategy:
      fail-fast: false
      matrix:
        tier: [micro, base, devel]
    uses: distrotwin/buildkit/.github/workflows/build-one.yml@97af05043ece47ee27fe5c2f8fb3e4b54eb482fe
    with:
      distro-id:  v11
      arch:       loong64
      tier:       ${{ matrix.tier }}
      runner:     ubuntu-22.04
      needs-qemu: true

  # if: always() —— 某个镜像没建出来，其余镜像的测试结论仍然有价值，
  # 报告要完整而不是一挂全无。缺的那几份由汇总阶段的 expected 抓。
  test:
    needs: [build, build-loong]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        did: [v4, v10sp1, v11]
        arch: [amd64, arm64]
        tier: [micro, base, devel]
    uses: distrotwin/buildkit/.github/workflows/test-one.yml@97af05043ece47ee27fe5c2f8fb3e4b54eb482fe
    with:
      distro-id: ${{ matrix.did }}
      arch:      ${{ matrix.arch }}
      tier:      ${{ matrix.tier }}
      runner:    ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}

  test-loong:
    needs: [build-loong]
    if: always() && inputs.include-loongarch
    strategy:
      fail-fast: false
      matrix:
        tier: [micro, base, devel]
    uses: distrotwin/buildkit/.github/workflows/test-one.yml@97af05043ece47ee27fe5c2f8fb3e4b54eb482fe
    with:
      distro-id: v11
      arch:      loong64
      tier:      ${{ matrix.tier }}
      runner:    ubuntu-22.04

  # expected 是结构性守卫：某个 job 在跑到检查前就挂掉不会产出结果，检查总数会
  # 「合法地」变低而基线放过它，结果数对不上则一定抓得住。
  # 勾了 loong 就多三份，所以这个数要跟着算而不是写死。
  report:
    needs: [test, test-loong]
    if: always()
    uses: distrotwin/buildkit/.github/workflows/report.yml@97af05043ece47ee27fe5c2f8fb3e4b54eb482fe
    with:
      distros:  "v4 v10sp1 v11"
      expected: ${{ inputs.include-loongarch && 21 || 18 }}
      baseline: ${{ inputs.include-loongarch && 870 || 750 }}

  # ── 发布。独立于 build/test，只有显式勾选才跑，且要求 report 真的通过。
  # 镜像一旦推上 GHCR 就公开可拉，这一步不该由日常构建顺带触发。
  publish:
    needs: [test, report]
    if: inputs.publish && needs.test.result == 'success' && needs.report.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { did: v4,     prefix: v4,     tier: micro, latest: false }
          - { did: v4,     prefix: v4,     tier: base,  latest: false }
          - { did: v4,     prefix: v4,     tier: devel, latest: false }
          - { did: v10sp1, prefix: v10sp1, tier: micro, latest: false }
          - { did: v10sp1, prefix: v10sp1, tier: base,  latest: false }
          - { did: v10sp1, prefix: v10sp1, tier: devel, latest: false }
          - { did: v11,    prefix: v11,    tier: micro, latest: false }
          - { did: v11,    prefix: v11,    tier: base,  latest: false }
          # latest 指向最高版本的 devel
          - { did: v11,    prefix: v11,    tier: devel, latest: true }
    uses: distrotwin/buildkit/.github/workflows/publish-one.yml@97af05043ece47ee27fe5c2f8fb3e4b54eb482fe
    with:
      distro-id:  ${{ matrix.did }}
      tier:       ${{ matrix.tier }}
      image:      kylin
      tag-prefix: ${{ matrix.prefix }}
      arches:     ${{ inputs.include-loongarch && matrix.did == 'v11' && 'amd64 arm64 loong64' || 'amd64 arm64' }}
      latest:     ${{ matrix.latest }}
