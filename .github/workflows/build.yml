name: 构建镜像

# 两个阶段，一个 job 只管一个镜像：
#
#   阶段一 build   版本 × 架构 × 档位 = 18 个 job 并行，各自产出一个镜像
#   阶段二 test    上一阶段全部完成后解锁，逐个装载镜像、真正启动、跑完整检查集
#                  最后汇总成一份测试报告
#
# 不设中间的 stage 阶段：selfhost 的 debootstrap 实测只占 4 分钟，而三个档位本来
# 并行，共用一份 stage 省的是 CPU 不是墙钟，却要多一层依赖和一次几百 MB 的制品往返。
#
# 期望失败由各版本 conf 的 XFAIL 声明，计入 xfail 不构成 CI 失败——老系统上有些
# 检查注定红且红得有道理，不强求研究仓库的每一条都过。
on:
  push:
    branches: [main]
    paths: ['distros/**', '.github/workflows/**', 'buildkit']
  pull_request:
    paths: ['distros/**', '.github/workflows/**', 'buildkit']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        did: [v4, v10sp1, v11]
        arch: [amd64, arm64]
        tier: [micro, base, devel]
    uses: distrotwin/buildkit/.github/workflows/build-one.yml@388c82cae00d1f3d5040d64178e2a317b9a77ebe
    with:
      distro-id: ${{ matrix.did }}
      arch:      ${{ matrix.arch }}
      tier:      ${{ matrix.tier }}
      runner:    ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}

  # if: always() —— 某个镜像没建出来，其余镜像的测试结论仍然有价值，
  # 报告要完整而不是一挂全无。缺的那几份由汇总阶段的 expected 抓。
  test:
    needs: [build]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        did: [v4, v10sp1, v11]
        arch: [amd64, arm64]
        tier: [micro, base, devel]
    uses: distrotwin/buildkit/.github/workflows/test-one.yml@388c82cae00d1f3d5040d64178e2a317b9a77ebe
    with:
      distro-id: ${{ matrix.did }}
      arch:      ${{ matrix.arch }}
      tier:      ${{ matrix.tier }}
      runner:    ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}

  report:
    needs: [test]
    if: always()
    uses: distrotwin/buildkit/.github/workflows/report.yml@388c82cae00d1f3d5040d64178e2a317b9a77ebe
    with:
      expected: 18
      baseline: 750
