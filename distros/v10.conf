# 银河麒麟桌面操作系统 V10（原版，suite 10.0）
#
# 这一版曾被判定为「拿不到」，依据是 universe 里没有 libc6。那个抽样是错的：
# V10 SP1 的 glibc 在 universe，V10 原版的在 main（2.23-0kord11k20.14），
# 同一个归档站不同 suite 的组件划分并不一致。
#
# 版本号也容易误判。它的 Release 自述是 "Kylin Desktop v4 V10 10.0"，
# Label 是 "v10-离在线更新推送"——那个 Label 描述的是分发用途，不代表内容不完整：
# 78 个 Priority: required 一个不缺，InRelease 由麒麟归档 key 正常签名。
# V10 原版是 v4 代码线（Ubuntu 16.04 血脉、dpkg 1.18、gcc 5.x），
# 与 V10 SP1（Ubuntu 20.04、glibc 2.31）不是一代东西。
DID=v10
DISPLAY_NAME="银河麒麟桌面 V10"
IMAGE=kylin-v10
FAMILY=deb
METHOD=selfhost                    # dpkg 1.18 读不了宿主 dpkg 写的 status，同 V4
MIRROR=http://archive.kylinos.cn/kylin/KYLIN-ALL/
SUITE=10.0                         # Suite 与 Codename 都是 10.0，与请求名一致
COMPONENTS="main universe"         # libc6 在 main（V4 在 universe，别照抄）
DEBOOTSTRAP_SCRIPT=xenial          # Ubuntu 16.04 血脉
USRMERGE=no
ADMINDIR="var/lib/dpkg"

# 源索引实测：libc6 2.23-0kord11k20.14、libstdc++6 5.4.0-6kord1~16.04.12
EXPECT_GLIBC=2.23
EXPECT_LIBSTDCPP=6.0.21
EXPECT_GLIBCXX=3.4.21

REPACK_DEBS=""
STUB_PROVIDES=""
PIN_NEVER=""

STAGE_INCLUDE="apt,apt-utils,gpgv,ca-certificates,locales,tzdata,libstdc++6"
MICRO_INCLUDE="ca-certificates,locales,tzdata,libstdc++6"
BASE_INCLUDE="iproute2,iputils-ping,lsof,unzip,vim-tiny,ca-certificates,tzdata,locales,python3,curl,procps,less,file,xz-utils,gnupg"
DEVEL_INCLUDE="build-essential,pkg-config"
EXPECT_SHADOW=0:42/640

# 与 V4 同源同代，预期同样带那个链接 libldap 的 gpgkeys_ldap。
# 若实际没有，报告会标 xpass，提醒把这条豁免收回。
XFAIL="elf_broken"
