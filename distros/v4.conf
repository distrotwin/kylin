# 银河麒麟桌面操作系统 V4 (4.0.2) —— deb 系，上游 Ubuntu 16.04
#
# 这一版没有 ISO 公开直链，取材走 apt 归档。suite 必须是 4.0.2（Release 的 Label 为
# 「银河麒麟桌面版本v4」）而不是 4.0.2sp4——后者 Label 是「v4-离在线更新推送」，
# 是补丁源，缺 libc6，从零 bootstrap 不出来。
#
# 未验证项：本配置尚未跑通一次完整构建。V4 自带 dpkg 1.18 / apt 1.2，比 V10 SP1 的
# 1.19.7 更旧，selfhost 第二段可能还需额外适配。首轮 CI 的作用就是把这些问题暴露出来。
DID=v4
DISPLAY_NAME="银河麒麟桌面 V4"
# 本地 docker tag 必须按版本区分。三份 conf 都写 IMAGE=kylin 时，
# 构建打出的 kylin:micro 会被后一个版本覆盖，而 verify.sh 会枚举全部 conf、
# 拿三套基线去量同一个镜像——表现是「期望 2.38 实际 2.31」这类看起来像
# 构建错了的失败。推到 GHCR 时的仓库名与 tag 由 workflow 拼，与这里无关。
IMAGE=kylin-v4
FAMILY=deb
METHOD=selfhost
MIRROR=http://archive.kylinos.cn/kylin/KYLIN-ALL/
# suite 必须写 4.0.2-desktop 而不是 4.0.2，尽管两个路径下是同一份内容
# （main/universe 的 Packages.gz 字节数完全相同）。原因是 dists/4.0.2/Release
# 里 Suite 与 Codename 都自称 4.0.2-desktop，而 debootstrap 会核对请求的 suite
# 名与 Release 的自述是否一致，不一致就拒绝：
#   E: Asked to install suite 4.0.2, but got 4.0.2-desktop from mirror
# apt 不做这项核对，所以 mmdebstrap 路径用哪个都行——这是 selfhost 独有的坑。
SUITE=4.0.2-desktop
COMPONENTS="main universe"        # libc6 在 universe（源索引实测 2.23-0kord10）
DEBOOTSTRAP_SCRIPT=xenial         # Ubuntu 16.04 血脉
USRMERGE=no
ADMINDIR="var/lib/dpkg"

# ── 验收基线。glibc 与 gcc 取自源索引实测；so 版本与 GLIBCXX 由 gcc 5.4 推导，
#    首轮构建会验证或证伪。留空会因「期望空==实际空」被门禁判通过，所以宁可写推导值。
EXPECT_GLIBC=2.23
EXPECT_LIBSTDCPP=6.0.21
EXPECT_GLIBCXX=3.4.21

REPACK_DEBS=""
STUB_PROVIDES=""
PIN_NEVER=""
STAGE_INCLUDE="apt,apt-utils,gpgv,ca-certificates,locales,tzdata,libstdc++6"
MICRO_INCLUDE="ca-certificates,locales,tzdata,libstdc++6"
BASE_INCLUDE="iproute2,iputils-ping,lsof,unzip,vim-tiny,ca-certificates,tzdata,locales,python3,curl,procps,less,file,xz-utils,gnupg"
DEVEL_INCLUDE="build-essential,pkg-config"
EXPECT_SHADOW=0:42/640

# ── 期望失败（XFAIL）：在本版本上注定红、且红得有道理的检查
#
# V4 是 Ubuntu 16.04 血脉，比其余被试老一个时代，有些检查的校准假设在它身上
# 不成立。这些项计入 xfail 而不是 fail，不构成 CI 失败；但若某项**居然通过了**
# 会被报成 xpass，提醒把这条豁免收回——否则它会永远挂着，掩盖以后真正的回归。
#
# elf_broken：gnupg 会装一个链接 libldap 的 gpgkeys_ldap，而本项目不装 Recommends，
#   于是 ldd 报缺库。真实的 V4 装机同样如此，镜像是忠实的，不是缺陷。
#   m_xt.so 同理（ircd 的可选模块，缺可选依赖）。
#   注意这条不是「允许有坏 ELF」的通行证——白名单机制仍在，只是这两个文件的
#   缺库状态与真机一致，不该由镜像来背。
XFAIL="elf_broken"
