# 银河麒麟桌面操作系统 V4 (4.0.2) —— deb 系，上游 Ubuntu 16.04
#
# 这一版没有 ISO 公开直链，取材走 apt 归档。suite 必须是 4.0.2（Release 的 Label 为
# 「银河麒麟桌面版本v4」）而不是 4.0.2sp4——后者 Label 是「v4-离在线更新推送」，
# 是补丁源，缺 libc6，从零 bootstrap 不出来。
#
# 未验证项：本配置尚未跑通一次完整构建。V4 自带 dpkg 1.18 / apt 1.2，比 V10 SP1 的
# 1.19.7 更旧，selfhost 第二段可能还需额外适配。首轮 CI 的作用就是把这些问题暴露出来。
DID=v4
DISPLAY_NAME="银河麒麟桌面 V4"
IMAGE=kylin
FAMILY=deb
METHOD=selfhost
MIRROR=http://archive.kylinos.cn/kylin/KYLIN-ALL/
SUITE=4.0.2
COMPONENTS="main universe"        # libc6 在 universe（源索引实测 2.23-0kord10）
DEBOOTSTRAP_SCRIPT=xenial         # Ubuntu 16.04 血脉
USRMERGE=no
ADMINDIR="var/lib/dpkg"

# ── 验收基线。glibc 与 gcc 取自源索引实测；so 版本与 GLIBCXX 由 gcc 5.4 推导，
#    首轮构建会验证或证伪。留空会因「期望空==实际空」被门禁判通过，所以宁可写推导值。
EXPECT_GLIBC=2.23
EXPECT_LIBSTDCPP=6.0.21
EXPECT_GLIBCXX=3.4.21

REPACK_DEBS=""
STUB_PROVIDES=""
PIN_NEVER=""
STAGE_INCLUDE="apt,apt-utils,gpgv,ca-certificates,locales,tzdata,libstdc++6"
MICRO_INCLUDE="ca-certificates,locales,tzdata,libstdc++6"
BASE_INCLUDE="iproute2,iputils-ping,lsof,unzip,vim-tiny,ca-certificates,tzdata,locales,python3,curl,procps,less,file,xz-utils,gnupg"
DEVEL_INCLUDE="build-essential,pkg-config"
EXPECT_SHADOW=0:42/640
