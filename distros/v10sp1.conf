# 银河麒麟桌面操作系统 V10 SP1 (2503) —— deb 系，上游 Ubuntu 20.04
#
# 注意 suite 是 10.1 而不是 10.0。10.0 的 Release 自述 Label 为「v10-离在线更新推送」，
# 是给已装机器推更新的差异源，universe 有四万多个包却没有 libc6，从零 bootstrap 不出来。
DID=v10sp1
DISPLAY_NAME="银河麒麟桌面 V10 SP1"
# 本地 docker tag 必须按版本区分。三份 conf 都写 IMAGE=kylin 时，
# 构建打出的 kylin:micro 会被后一个版本覆盖，而 verify.sh 会枚举全部 conf、
# 拿三套基线去量同一个镜像——表现是「期望 2.38 实际 2.31」这类看起来像
# 构建错了的失败。推到 GHCR 时的仓库名与 tag 由 workflow 拼，与这里无关。
IMAGE=kylin-v10sp1
FAMILY=deb
METHOD=selfhost                   # mmdebstrap 撞 debconf 依赖环；且宿主 dpkg1.22 写的 status
                                  # 麒麟自带的 dpkg1.19.7 读不了，必须自举
MIRROR=http://archive.kylinos.cn/kylin/KYLIN-ALL/
SUITE=10.1
COMPONENTS="main universe"

# 更新源。基础 suite 10.1 是冻结的发布树，厂商把后续构建放在独立的 -updates suite 里，
# 官方 sources.list 文档里就列着它们（"#V10 SP1 2203版本" / "2403"）。不配的话镜像会停在
# 发布时的包版本：实测 ca-certificates 停在 2021-01 而安装介质是 2024-02，openssl 落后
# 11 个构建修订。那不是「旧但保守」——旧 CA 会让构建拉 https 失败，而客户真机不会，
# 属于假失败，方向比落后更糟。
#
# 补齐程度是有限的：与 2503 介质的 150 项差异，叠加这两个源能精确补齐 71 项，
# 其余拉近但不相等。厂商 respin 里有一批构建从未推到公开归档，这是材料的边界。
EXTRA_SUITES="10.1-2403-updates 10.1-2203-updates"
DEBOOTSTRAP_SCRIPT=focal          # Ubuntu 20.04 血脉
USRMERGE=no                       # 非 usr-merged：dash 装 ./bin/sh
ADMINDIR="var/lib/dpkg"

# ── 验收基线
EXPECT_GLIBC=2.31
EXPECT_LIBSTDCPP=6.0.28
EXPECT_GLIBCXX=3.4.28
case "$ARCH" in
  loongarch64)
    # 这一支不是同一条产品线：源索引实测 glibc 2.28-10.kylin.26k1、
    # libstdc++6 为 8.3.0-6.lnd.vec.24（lnd = Loongnix Desktop），
    # 比 amd64 的 2.31 + gcc 10.3 落后一个大版本。同一个版本号下 ABI 并不一致。
    EXPECT_GLIBC=2.28
    EXPECT_LIBSTDCPP=6.0.25
    EXPECT_GLIBCXX=3.4.25
    ;;
esac

REPACK_DEBS=""                    # V10 没有 libboundscheck
STUB_PROVIDES=""                  # selfhost 路径的 sources.list 不含本地源，不需要假包
PIN_NEVER=""                      # required 集本来就含 initramfs-tools，pin 反而制造 unmet；
                                  # 它生成的 initrd 由 adapt 阶段删掉

# --foreign 只抽 required 集，apt 等必须显式 --include 才会下到 stage
STAGE_INCLUDE="apt,apt-utils,gpgv,ca-certificates,locales,tzdata,libstdc++6"
MICRO_INCLUDE="ca-certificates,locales,tzdata,libstdc++6"
BASE_INCLUDE="iproute2,libatm1,iputils-ping,lsof,zstd,unzip,vim-tiny,ca-certificates,tzdata,locales,python3,curl,procps,less,file,xz-utils,gnupg"
DEVEL_INCLUDE="build-essential,pkg-config"
EXPECT_SHADOW=0:42/640
